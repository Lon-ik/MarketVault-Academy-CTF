name: marketvault-academy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-marketvault}"
      POSTGRES_USER: "${POSTGRES_USER:-marketvault}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-marketvault}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketvault} -d ${POSTGRES_DB:-marketvault}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-marketvault}"
      MONGO_INITDB_DATABASE: "${MONGO_DB:-marketvault}"
    volumes:
      - mongodata:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:-marketvault}"
    volumes:
      - redisdata:/data
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-marketvault} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: ./services/auth-service
      network: host
    environment:
      PORT: "8000"
      # Минимальные права: SQL-инъекция в логине не даёт суперпользователя БД.
      DATABASE_URL: "postgresql://auth_service:${AUTH_SERVICE_DB_PASSWORD:-auth-service-pass}@postgres:5432/${POSTGRES_DB:-marketvault}"
      DB_SCHEMA: auth
      REDIS_URL: "redis://:${REDIS_PASSWORD:-marketvault}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-weak-jwt-secret}"
      JWT_ALGORITHM: HS256
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3000}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      network: host
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-marketvault}:${POSTGRES_PASSWORD:-marketvault}@postgres:5432/${POSTGRES_DB:-marketvault}"
      DB_SCHEMA: inventory
      REDIS_URL: "redis://:${REDIS_PASSWORD:-marketvault}@redis:6379/1"
      JWT_SECRET: "${JWT_SECRET:-weak-jwt-secret}"
    user: "1000:1000"
    cap_drop:
      - ALL
    expose:
      - "8080"
    volumes:
      - ./runtime/flags/inventory:/var/www/flags:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/inventory/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  legacy-service:
    build:
      context: ./services/legacy-service
      network: host
    environment:
      FLAG_DIR: /var/www/flags
    volumes:
      - ./runtime/flags/legacy:/var/www/flags:ro
    expose:
      - "80"
    # Отдельная сеть: из скомпрометированного портала не видно ни базы, ни redis,
    # ни остальных сервисов — только шлюз.
    networks:
      - legacy
    mem_limit: 256m
    cpus: 0.5
    # Задания легаси-портала (RCE, LFI, XXE, upload, unserialize) остаются рабочими,
    # но контейнер не может достать хост: нет доступа к диску хоста, ограничены
    # процессы, память и запись. Uploads и /tmp живут в tmpfs с лимитом.
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/apache2:size=8m,mode=755
      - /var/lock/apache2:size=8m,mode=755
      - /var/lib/php/sessions:size=16m,mode=1777
      - /var/www/html/uploads:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  stats-service:
    build:
      context: ./services/stats-service
      network: host
    environment:
      PORT: "8000"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-marketvault}@redis:6379/2"
      STATS_TOKEN: "${STATS_TOKEN:-internal-stats-token}"
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      network: host
    environment:
      PORT: "4000"
      AUTH_SERVICE_URL: "http://auth-service:8000"
      INVENTORY_SERVICE_URL: "http://inventory-service:8080"
      LEGACY_SERVICE_URL: "http://legacy-service"
      STATS_SERVICE_URL: "http://stats-service:8000"
      MONGO_URL: "mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-marketvault}@mongo:27017/${MONGO_DB:-marketvault}?authSource=admin"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-marketvault}@redis:6379/3"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-marketvault}:${POSTGRES_PASSWORD:-marketvault}@postgres:5432/${POSTGRES_DB:-marketvault}"
      JWT_SECRET: "${JWT_SECRET:-weak-jwt-secret}"
      SESSION_SECRET: "${SESSION_SECRET:-weak-session-secret}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      SUPPORT_LLM_URL: "${SUPPORT_LLM_URL:-}"
      SUPPORT_LLM_MODEL: "${SUPPORT_LLM_MODEL:-}"
      # Как часто возвращать остатки товаров к изначальным, в минутах.
      STOCK_RESET_MINUTES: "${STOCK_RESET_MINUTES:-15}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Наружу отдаём только через туннель: контейнеры до этих портов не дотянутся.
      - "127.0.0.1:4000:4000"
    depends_on:
      auth-service:
        condition: service_started
      inventory-service:
        condition: service_started
      legacy-service:
        condition: service_started
      stats-service:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - backend
      - legacy
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      network: host
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
      VITE_APP_NAME: "MarketVault Academy"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edge
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  legacy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  mongodata:
  redisdata: